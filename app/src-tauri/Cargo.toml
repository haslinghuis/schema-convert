[package]
name = "schema-convert-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Turn a flight-controller schematic into a Betaflight target"
license = "GPL-3.0-or-later"

[lib]
name = "schema_convert_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
